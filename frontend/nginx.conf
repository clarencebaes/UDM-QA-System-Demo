server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never let nginx try to interpret a specific version/be the app server.
    client_max_body_size 2m;

    # Reverse-proxy API calls to the backend service (Docker service name "api"
    # resolves on the compose network; in single-container setups this is
    # replaced by the real backend URL). Keeps the frontend same-origin.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Single-page app: any unknown path falls back to index.html so React
    # Router (BrowserRouter) can handle client-side routes like /qa/login.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached hard; index.html must not be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
